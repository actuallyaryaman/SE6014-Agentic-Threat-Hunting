
input {
  http {
    host => "0.0.0.0"
    port => 8088
    codec => json
  }
}

filter {
  # Preserve the ingestion mode if provided by A3.
  if ![labels][ingest_mode] {
    mutate {
      add_field => { "[labels][ingest_mode]" => "push" }
    }
  }

  # Preserve the originating source identifier.
  if ![labels][source_id] {
    mutate {
      add_field => { "[labels][source_id]" => "a2-push-local" }
    }
  }

  # Generate Elasticsearch document IDs.
  # Prefer ECS event.id, then legacy event_id.
  # If neither exists, generate a new UUID.
  if [event][id] and [event][id] != "" {
    fingerprint {
      source => ["[labels][source_id]", "[event][id]"]
      target => "[@metadata][document_id]"
      method => "SHA256"
      concatenate_sources => true
    }
  } else if [event_id] and [event_id] != "" {
    fingerprint {
      source => ["[labels][source_id]", "event_id"]
      target => "[@metadata][document_id]"
      method => "SHA256"
      concatenate_sources => true
    }
  } else {
    uuid {
      target => "[@metadata][document_id]"
    }
  }
}

output {
  # Isolate malformed JSON from normal security events.
  if "_jsonparsefailure" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "a2-quarantine-%{+YYYY.MM.dd}"
    }

  # Route valid events through the selected Elasticsearch
  # ingest pipeline when an identifier is provided.
  } else if [labels][ingest_pipeline] and [labels][ingest_pipeline] != "" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "${A2_INDEX_PREFIX:a2-push}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
      pipeline => "%{[labels][ingest_pipeline]}"
    }

  # Index valid events without an explicitly selected parser.
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "${A2_INDEX_PREFIX:a2-push}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
    }
  }

  # Local debugging output.
  stdout {
    codec => rubydebug
  }
}
