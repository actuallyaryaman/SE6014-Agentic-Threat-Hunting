
input {
  http {
    host => "0.0.0.0"
    port => 8088
    codec => json
  }
}

filter {
  if ![labels][ingest_mode] {
    mutate {
      add_field => { "[labels][ingest_mode]" => "push" }
    }
  }

  if ![labels][source_id] {
    mutate {
      add_field => { "[labels][source_id]" => "a2-push-local" }
    }
  }

  if [event_id] and [event_id] != "" {
    mutate {
      copy => {
        "event_id" => "[@metadata][document_id]"
      }
    }
  } else {
    fingerprint {
      source => ["[labels][source_id]", "message"]
      target => "[@metadata][document_id]"
      method => "SHA256"
      concatenate_sources => true
    }
  }
}

output {
  if [labels][ingest_pipeline] and [labels][ingest_pipeline] != "" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "${A2_INDEX_PREFIX:a2-push}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
      pipeline => "%{[labels][ingest_pipeline]}"
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "${A2_INDEX_PREFIX:a2-push}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
    }
  }

  stdout {
    codec => rubydebug
  }
}
