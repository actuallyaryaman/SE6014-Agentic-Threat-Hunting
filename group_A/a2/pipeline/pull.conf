
input {
  file {
    path => "/usr/share/logstash/a2_incoming/*.ndjson"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/a2-pull.sincedb"
    codec => json
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/a2-completed-files.log"
  }
}

filter {
  # Preserve an existing ingestion mode.
  if ![labels][ingest_mode] {
    mutate {
      add_field => { "[labels][ingest_mode]" => "pull" }
    }
  }

  # Preserve source metadata or derive it from the file path.
  if ![labels][source_id] {
    if [log][file][path] {
      mutate {
        copy => { "[log][file][path]" => "[labels][source_id]" }
      }
    } else if [path] {
      mutate {
        copy => { "path" => "[labels][source_id]" }
      }
    } else {
      mutate {
        add_field => { "[labels][source_id]" => "a2-pull-local" }
      }
    }
  }

  # Generate stable IDs for events with unique identifiers.
  # Generate a UUID when no event identifier is available.
  if [event][id] and [event][id] != "" {
    fingerprint {
      source => ["[labels][source_id]", "[event][id]"]
      target => "[@metadata][document_id]"
      method => "SHA256"
      concatenate_sources => true
    }
  } else if [event_id] and [event_id] != "" {
    fingerprint {
      source => ["[labels][source_id]", "event_id"]
      target => "[@metadata][document_id]"
      method => "SHA256"
      concatenate_sources => true
    }
  } else {
    uuid {
      target => "[@metadata][document_id]"
    }
  }
}

output {
  # Quarantine malformed JSON instead of normal indexing.
  if "_jsonparsefailure" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "a2-quarantine-%{+YYYY.MM.dd}"
    }

  # Route valid events through an explicitly selected parser.
  } else if [labels][ingest_pipeline] and [labels][ingest_pipeline] != "" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "${A2_INDEX_PREFIX:a2-pull}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
      pipeline => "%{[labels][ingest_pipeline]}"
    }

  # Index valid events without an explicitly selected parser.
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
      index => "${A2_INDEX_PREFIX:a2-pull}-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
    }
  }

  stdout {
    codec => rubydebug
  }
}
