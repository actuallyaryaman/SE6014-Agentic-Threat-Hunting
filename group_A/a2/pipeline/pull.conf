
input {
  file {
    path => "/usr/share/logstash/a2_incoming/*.ndjson"
    mode => "read"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/a2-pull.sincedb"
    codec => json
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/a2-completed-files.log"
  }
}

filter {
  mutate {
    add_field => { "ingest_mode" => "pull" }
  }

  fingerprint {
    source => ["@timestamp", "event_id", "message"]
    target => "[@metadata][document_id]"
    method => "SHA256"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL}"]
    user => "${ELASTICSEARCH_USER}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
    index => "a2-pull-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][document_id]}"
  }

  stdout {
    codec => rubydebug
  }
}
