services:
  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.23
    container_name: logstash-a1
    env_file:
      - ../.env
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./sample-data:/usr/share/logstash/ingest_data:ro
      - ../certs/http_ca.crt:/usr/share/logstash/config/certs/http_ca.crt:ro
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    container_name: kibana-a1
    environment:
      SERVER_HOST: "0.0.0.0"
      ELASTICSEARCH_HOSTS: '["https://172.18.0.2:9200"]'
      KIBANA_SERVICE_ACCOUNT_TOKEN: "${KIBANA_SERVICE_ACCOUNT_TOKEN:?Add KIBANA_SERVICE_ACCOUNT_TOKEN to the root .env file}"
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/http_ca.crt
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - ../certs/http_ca.crt:/usr/share/kibana/config/certs/http_ca.crt:ro
    networks:
      - elastic

networks:
  elastic:
    external: true
    name: elastic
