name: Group B CI

on:
  push:
    paths:
      - "group_B/**"
      - ".github/workflows/group-b-ci.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: group-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Group B
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r group_B/requirements.txt

      - name: Verify OTRF fixtures
        run: python group_B/scripts/fetch_otrf_fixtures.py --check

      - name: Run Group B tests
        working-directory: group_B
        run: python -m pytest -q
