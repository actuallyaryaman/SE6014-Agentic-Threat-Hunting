name: B1 checks

on:
  pull_request:
    paths:
      - "group_B/B1/**"
      - ".github/workflows/b1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b1:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run B1 tests (recogniser, pipeline policy, Elasticsearch pipelines)
        env:
          ES_URL: http://localhost:9200
        run: |
          TESTS=$(find group_B -type d -ipath 'group_B/b1/tests' | head -1)
          echo "Using test folder: $TESTS"
          python -m unittest discover -s "$TESTS" -v
