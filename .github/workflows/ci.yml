
name: Repository CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate repository files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Validate Compose YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("group_A/docker-compose.yaml"),
              Path("group_A/docker-compose.local.yaml"),
          ]

          for file in files:
              if not file.is_file():
                  raise SystemExit(f"Missing required file: {file}")

              with file.open(encoding="utf-8") as stream:
                  content = yaml.safe_load(stream)

              if not isinstance(content, dict):
                  raise SystemExit(f"Invalid YAML structure: {file}")

              print(f"PASS: {file}")
          PY

      - name: Validate sample security events
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          file = Path("group_A/sample-data/security-events.ndjson")

          if not file.is_file():
              raise SystemExit(f"Missing required file: {file}")

          with file.open(encoding="utf-8") as stream:
              lines = [line.strip() for line in stream if line.strip()]

          if not lines:
              raise SystemExit("Sample event file is empty")

          for number, line in enumerate(lines, start=1):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError as error:
                  raise SystemExit(
                      f"Invalid JSON on line {number}: {error}"
                  ) from error

              if not isinstance(event, dict):
                  raise SystemExit(
                      f"Line {number} must contain a JSON object"
                  )

          print(f"PASS: {len(lines)} valid sample events")
          PY

      - name: Check required A1 files
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("README.md"),
              Path("group_A/README.md"),
              Path("group_A/logstash/pipeline/logstash.conf"),
              Path("group_A/sample-data/security-events.ndjson"),
              Path(".env.example"),
          ]

          missing = [str(file) for file in files if not file.is_file()]

          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          print("PASS: all required A1 files exist")
          PY
